<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BudgetWise - Transactions & Goals</title>
    <link rel="stylesheet" href="./assets/css/nav.css" />
    <link rel="stylesheet" href="./assets/css/index.css" />
  </head>
  <body>
    <nav>
      <a href="index.html">Financial Goals</a>
      <a href="report.html">Report</a>
      <a href="addTransaction.html">Add Transaction</a>
      <span
        id="userInfo"
        style="color: white; margin-right: auto; display: none"
      ></span>
      <a href="#" id="logoutLink" onclick="handleLogout()" style="display: none"
        >Logout</a
      >
    </nav>

    <div class="container">
      <!-- GOALS SECTION -->
      <section id="goals-section">
        <h2>Financial Goals</h2>

        <div class="form-group">
          <h3>Create New Goal</h3>
          <div style="margin-bottom: 10px; display: flex; gap: 20px">
            <div style="width: 50%">
              <input id="name" placeholder="Goal Name" />
              <p id="nameError" class="error"></p>
            </div>
            <div style="width: 50%">
              <input id="target" type="number" placeholder="Target Amount" />
              <p id="targetError" class="error"></p>
            </div>
          </div>
          <div style="margin-bottom: 10px; display: flex; gap: 20px">
            <div style="width: 60%;">
              <input id="deadline" type="date" />
              <p id="deadlineError" class="error"></p>
            </div>
            <button style="width: 30%; height: 95%;" onclick="createGoal()">
              Create Goal
            </button>
          </div>
        </div>

        <div>
          <h3>All Goals</h3>
          <button onclick="getAllGoals()">Load Goals</button>
          <div id="goals" style="margin-top: 15px"></div>
        </div>
      </section>
    </div>

    <!-- Scripts -->
    <script src="assets/js/financialGoals.js"></script>
  </body>
</html>
